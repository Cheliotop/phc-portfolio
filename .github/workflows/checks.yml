name: Portfolio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PHC_Mobile/phc-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand --silent
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PHC_Web_Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
